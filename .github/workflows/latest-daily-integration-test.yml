name: Test integration in latest daily

on:
  workflow_run:
    workflows: ["Build and test"]
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  get-pr-url:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    outputs:
      pr_url: ${{ steps.lookup.outputs.url }}
    steps:
      - name: Look up PR url
        id: lookup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" \
            --jq '.[0].html_url')
          echo "url=$PR_URL" >> $GITHUB_OUTPUT

  full-pack-test:
    needs: get-pr-url
    name: Test in latest daily
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    container:
      image: ghcr.io/malteeez/gtnh-daily:latest
    env:
      PR_URL: ${{ needs.get-pr-url.outputs.pr_url }}

    steps:
      - name: Check out PR build artifact
        uses: MalTeeez/packscripts@1.4.3
        with:
          command: pr apply $PR_URL --build_job "Build and test"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run pack test
        run: |
          bash /entrypoint.sh
